services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: ymym-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ymym
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - 5432:5432

volumes:
  pgdata:
