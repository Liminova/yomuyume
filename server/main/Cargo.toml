[package]
name = "yomuyume"
version = "1.0.3"
edition = "2024"

[[bin]]
name = "yomuyume"
path = "main.rs"

[dependencies]
api-endpoints = { path = "../api-endpoints" }
argon2 = "0.5.3"
axum = "0.8.1"
axum-extra = { version = "0.10.0", features = ["cookie", "query"] }
chrono = { version = "0.4.30", features = ["serde"] }
frontend-spa = { path = "../frontend-spa" }
futures-core = "0.3.31"
image = { version = "0.25.2", features = ["avif-native"] }
lettre = "0.11.2"
quick-xml = { version = "0.38.3", features = ["serialize", "encoding"] }
rayon = "1.11.0"
redb = "3.0.1"
redb-json-derive = { path = "../redb-json-derive" }
serde = { version = "1.0.188", features = ["serde_derive"] }
serde_json = "1.0.108"
serde_with = "3.12.0"
tantivy = "0.25.0"
thiserror = "2.0.2"
tokio = { version = "1.32.0", features = ["full"] }
tokio-util = { version = "0.7.12", features = ["io"] }
tower-http = { version = "0.6.2", features = ["tracing", "trace", "cors"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "ansi"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "chrono"] }
utoipa-redoc = { version = "6.0.0", features = ["axum"] }

[dev-dependencies]
anyhow = "1.0.99"
criterion = { version = "0.7.0", features = ["html_reports", "async_tokio"] }
regex = "1.11.1"
tempfile = "3.14.0"
tracing-test = "0.2.5"


[[bench]]
name = "main"
harness = false
path = "benches/main.rs"
